name: Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The actions are named by their commit, a changed tag can not change what runs here
# with the right to write the image.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before anything is published: build the image, start it and ask it
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: filebrowser:test
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image and ask it
        run: |
          docker run -d --name filebrowser -p 8080:80 filebrowser:test
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          docker logs filebrowser
          docker rm -f filebrowser

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: COMMIT=${{ github.sha }}
          # Only latest: with a second tag GitHub shows that one in "Install from the command line"
          tags: ghcr.io/gatzenga/filebrowser:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
